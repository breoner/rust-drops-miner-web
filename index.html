<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rust Drops Miner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo-container">
      <svg class="logo-icon" viewBox="0 0 24 24" width="32" height="32">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="currentColor"/>
      </svg>
      <h1>Rust Drops Miner</h1>
    </div>
    <div class="status-badge">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Ожидание...</span>
    </div>
  </header>

  <main>
    <div id="authBox" class="auth-box" style="display: none;">
      <p>Для привязки аккаунта перейдите по ссылке и введите код:</p>
      <div id="authCode" class="auth-code">--------</div>
      <a id="authLink" href="#" target="_blank" class="auth-btn">Авторизоваться на Twitch</a>
    </div>

    <div style="margin-bottom: 16px;">
      <button id="addAccountBtn" class="auth-btn" style="cursor: pointer;">+ Добавить аккаунт Twitch</button>
    </div>

    <section>
      <div class="section-title">Прогресс наград по аккаунтам</div>
      <div id="usersContainer" style="display: flex; flex-direction: column; gap: 24px;"></div>
    </section>

    <section>
      <div class="section-title" style="margin-top: 24px;">Консоль событий</div>
      <div id="console" class="console-container"></div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
