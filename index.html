<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rust Drops Miner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo-container">
      <h1>Rust Drops Miner</h1>
    </div>
    <div class="status-badge">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Ожидание...</span>
    </div>
  </header>

  <main>
    <section class="timer-section">
      <div class="timer-header">
        <div class="timer-info">
          <span class="timer-label">Кампания Rust Drops:</span>
          <span id="campaignName" class="campaign-name">Поиск активных раундов...</span>
        </div>
        <span id="campaignBadge" class="timer-badge">Ожидание</span>
      </div>

      <div class="countdown-grid">
        <div class="time-box">
          <span id="timerDays">00</span>
          <label>Дней</label>
        </div>
        <div class="time-box">
          <span id="timerHours">00</span>
          <label>Часов</label>
        </div>
        <div class="time-box">
          <span id="timerMinutes">00</span>
          <label>Минут</label>
        </div>
        <div class="time-box">
          <span id="timerSeconds">00</span>
          <label>Секунд</label>
        </div>
      </div>

      <div class="campaign-drops-container">
        <div class="campaign-drops-title">Скины текущей кампании:</div>
        <div id="campaignDropsGrid" class="campaign-drops-grid">
          <p class="no-drops-text">Загрузка скинов кампании...</p>
        </div>
      </div>
    </section>

    <div id="authBox" class="auth-box" style="display: none;">
      <p>Для привязки аккаунта перейдите по ссылке и введите код:</p>
      <div id="authCode" class="auth-code">--------</div>
      <a id="authLink" href="#" target="_blank" class="auth-btn">Авторизоваться на Twitch</a>
    </div>

    <div style="margin-bottom: 16px;">
      <button id="addAccountBtn" class="auth-btn" style="cursor: pointer;">+ Добавить аккаунт Twitch</button>
    </div>

    <section>
      <div class="section-title">Прогресс наград по аккаунтам</div>
      <div id="usersContainer" style="display: flex; flex-direction: column; gap: 24px;"></div>
    </section>

    <section>
      <div class="section-title" style="margin-top: 24px;">Консоль событий</div>
      <div id="console" class="console-container"></div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
